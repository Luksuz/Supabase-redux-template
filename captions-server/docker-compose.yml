version: '3.8'

services:
  captions-server:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Optional: Mount logs directory
      - ./logs:/app/logs
    networks:
      - captions-network

networks:
  captions-network:
    driver: bridge 